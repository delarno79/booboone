name: Auto-Blog Publisher

# Runs 3x/day, timed for a US (Eastern) audience:
#   12:00 UTC =  8:00 AM ET  (morning)
#   17:00 UTC =  1:00 PM ET  (midday)
#   23:00 UTC =  7:00 PM ET  (evening)
# NOTE: GitHub cron is always UTC and does NOT follow daylight saving. These
# times are correct for EDT (summer). During EST (winter) they land one hour
# earlier (7 AM / 12 PM / 6 PM ET) - shift each hour +1 if you want to correct it.
# You can also trigger it manually from the Actions tab ("Run workflow").
on:
  # Triggered EXTERNALLY (cron-job.org -> GitHub API) at 8AM/1PM/7PM ET.
  # We do NOT use GitHub's own `schedule:` trigger because it is delayed 30-45
  # min and sometimes skipped entirely. A workflow_dispatch API call runs within
  # seconds, so an external clock gives us precise, reliable timing.
  workflow_dispatch:
    inputs:
      limit:
        description: "Max posts to publish this run (blank = one per category)"
        required: false
        default: ""
      attempt:
        description: "Internal retry counter (leave blank)"
        required: false
        default: "1"

# Allow the workflow to commit the updated publishing state back to the repo.
permissions:
  contents: write

concurrency:
  group: auto-blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish articles
        env:
          # --- WordPress ---
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          # --- Text (DeepSeek) ---
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # --- Images: AtlasCloud (Z-Image Turbo) is the active provider ---
          ATLAS_API_KEY: ${{ secrets.ATLAS_API_KEY }}
          ATLAS_IMAGE_MODEL: ${{ vars.ATLAS_IMAGE_MODEL || 'z-image/turbo' }}
          ATLAS_IMAGE_SIZE: ${{ vars.ATLAS_IMAGE_SIZE || '1536*1024' }}
          IMAGE_SOURCE: ${{ vars.IMAGE_SOURCE || 'atlas' }}
          # --- Images: OpenAI (fallback provider; set IMAGE_SOURCE=openai to use) ---
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-1-mini' }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'medium' }}
          OPENAI_IMAGE_SIZE: ${{ vars.OPENAI_IMAGE_SIZE || '1536x1024' }}
          # --- Behaviour ---
          POST_STATUS: ${{ vars.POST_STATUS || 'publish' }}
        run: python main.py ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}

      - name: Persist publishing state
        if: always()
        run: |
          git config user.name "auto-blog-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain keywords.state.json)" ]; then
            git add keywords.state.json
            git commit -m "chore: update publishing state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoblog-logs
          path: logs/
          retention-days: 14
          if-no-files-found: ignore

      # Self-healing: if this run failed (e.g. the host briefly blocked GitHub's
      # IP), automatically re-trigger on a FRESH runner (new IP). This automates
      # the "manual re-run works" recovery. Stops after 3 total attempts.
      - name: Auto-retry on a fresh runner if the run failed
        if: ${{ failure() && fromJSON(github.event.inputs.attempt || '1') < 3 }}
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          ATTEMPT="${{ github.event.inputs.attempt || '1' }}"
          NEXT=$((ATTEMPT + 1))
          echo "Run failed (attempt $ATTEMPT). Waiting 45s, then re-running on a fresh server (attempt $NEXT)..."
          sleep 45
          curl -s -X POST \
            -H "Authorization: Bearer $DISPATCH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"attempt\":\"$NEXT\"}}"
